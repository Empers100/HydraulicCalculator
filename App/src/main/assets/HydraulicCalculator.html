<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Гидравлический калькулятор</title>
<style>
    :root {
      --bg: #f4f4f4; --surface: #ffffff; --text: #333333; --text-secondary: #666666;
      --border: #cccccc; --btn-bg: #e0e0e0; --btn-func: #d0d0d0;
      --btn-active: #0096c9; --btn-active-text: white; --shadow: 0 2px 8px rgba(0,0,0,0.1);
      --display-bg: #f5f5f5;
    }
    body.dark {
      --bg: #1a1a2e; --surface: #2d2d44; --text: #f0f0f0; --text-secondary: #cccccc;
      --border: #444466; --btn-bg: #4a4a6a; --btn-func: #5a5a7a;
      --btn-active: #0f3460; --shadow: 0 2px 8px rgba(0,0,0,0.4); --display-bg: #1e1e2f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center; padding: 12px; min-height: 100vh;
      transition: background 0.3s;
    }
    .container {
      width: 100%; max-width: 580px; background: var(--surface);
      border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative;
    }
    .header { display: flex; justify-content: flex-end; align-items: center; }
    .menu-btn {
      width: 40px; height: 40px; border: none; background: var(--btn-bg);
      color: var(--text); font-size: 24px; font-weight: bold; border-radius: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .menu {
      position: absolute; top: 60px; right: 16px; background: var(--surface);
      border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      padding: 12px; z-index: 100; min-width: 230px; display: none; border: 1px solid var(--border);
    }
    .menu.show { display: block; }
    .menu-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 8px; border-bottom: 1px solid var(--border); color: var(--text); font-size: 16px;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item select, .menu-item button {
      padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--btn-bg); color: var(--text); font-size: 14px; cursor: pointer;
    }
    .theme-toggle {
      width: 50px; height: 26px; background: var(--btn-bg); border-radius: 13px;
      position: relative; cursor: pointer; border: 1px solid var(--border);
    }
    .theme-toggle::after {
      content: ''; width: 22px; height: 22px; background: var(--btn-active);
      border-radius: 50%; position: absolute; top: 1px; left: 2px; transition: 0.2s;
    }
    body.dark .theme-toggle::after { transform: translateX(24px); }
    .tab-content { display: flex; flex-direction: column; gap: 4px; }
    .display-container { display: flex; flex-direction: column; }
    .formula-display {
      padding: 8px 16px; font-size: 14px; text-align: right;
      background: var(--display-bg); border-radius: 16px 16px 0 0;
      color: var(--text-secondary); min-height: 36px; word-wrap: break-word;
      border-bottom: 1px solid var(--border);
    }
    .main-display-row {
      display: flex; align-items: center; background: var(--display-bg);
      border-radius: 0 0 16px 16px; padding: 0 16px;
    }
    .main-display-row label { font-size: 14px; color: var(--text-secondary); margin-right: 8px; white-space: nowrap; }
    .main-display {
      flex: 1; padding: 16px 0; font-size: 28px; text-align: right;
      background: transparent; border: none; font-weight: 500; color: var(--text);
      outline: none; width: 100%;
    }
    .field-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; min-height: 48px; margin-bottom: 4px;
    }
    .field-row label { flex: 1; font-size: 14px; color: var(--text-secondary); margin-right: 2px; padding: 4px 0; line-height: 1.3; }
    .field-row input, .field-row select {
      flex: 1; padding: 10px 8px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--btn-bg); color: var(--text);
      font-size: 16px; text-align: right; min-width: 0;
    }
    .engineer-block { display: none; flex-direction: column; gap: 5px; }
    .extra-resistances { display: none; flex-direction: column; gap: 5px; }
    .engineer-block.show { display: flex; }
    .info-block { display: none; margin-top: 4px; }
    .info-block.show { display: block; }
    .info-panel {
      font-size: 12px; color: var(--text-secondary); font-style: italic;
      background: var(--display-bg); padding: 8px; border-radius: 12px;
      margin-bottom: 4px; display: none;
    }
    .info-panel.show { display: block; }
    .btn-row { display: flex; gap: 8px; margin-top: 6px; }
    .calc-btn, .save-btn {
      flex: 1; padding: 14px; font-size: 16px; font-weight: bold;
      background: var(--btn-active); color: white; border: none;
      border-radius: 14px; cursor: pointer;
    }
    .save-btn:disabled { opacity: 0.5; cursor: default; }
    .result-area {
      background: var(--display-bg); border-radius: 16px; padding: 12px;
      display: flex; flex-direction: column; gap: 4px; font-size: 14px;
    }
    .result-area span { color: var(--text); }
    .note { color: #e06c00; font-weight: 500; display: none; }
    .note.show { display: block; }
    .extra-resistances { display: none; flex-direction: column; gap: 6px; }
    .extra-resistances.show { display: flex; }

    .reliability-indicator {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 12px;
      font-size: 13px; font-weight: 500; margin-top: 4px;
    }
    .reliability-green { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    body.dark .reliability-green { background: #1e3a2a; color: #8fd19e; border-color: #2d5a3d; }
    .reliability-yellow { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
    body.dark .reliability-yellow { background: #3d3520; color: #f0c040; border-color: #5c4a1f; }
    .reliability-red { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    body.dark .reliability-red { background: #3d1f22; color: #f08c90; border-color: #5c2d30; }
    .reliability-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .reliability-green .reliability-dot { background: #28a745; }
    .reliability-yellow .reliability-dot { background: #ffc107; }
    .reliability-red .reliability-dot { background: #dc3545; }
    .reliability-tooltip { font-size: 12px; margin-top: 2px; color: inherit; opacity: 0.9; }

    input.warning-border, select.warning-border { border-color: #ffc107 !important; box-shadow: 0 0 0 2px rgba(255, 193, 7, 0.2) !important; }
    input.error-border, select.error-border { border-color: #dc3545 !important; box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.2) !important; }
    .warning-list { list-style: none; padding: 0; margin: 4px 0; }
    .warning-item {
      padding: 4px 8px; margin: 2px 0; border-radius: 6px;
      font-size: 13px; display: flex; align-items: flex-start; gap: 6px;
    }
    .warning-critical { background: #f8d7da; color: #721c24; border-left: 3px solid #dc3545; }
    .warning-caution { background: #fff3cd; color: #856404; border-left: 3px solid #ffc107; }
    .warning-info { background: #d1ecf1; color: #0c5460; border-left: 3px solid #17a2b8; }
    body.dark .warning-critical { background: #3d1f22; color: #f08c90; border-left-color: #dc3545; }
    body.dark .warning-caution { background: #3d3520; color: #f0c040; border-left-color: #ffc107; }
    body.dark .warning-info { background: #1a2d33; color: #7ec8d8; border-left-color: #17a2b8; }
    .warning-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

    .lng-composition {
      display: none; flex-direction: column; gap: 4px;
      margin-top: 4px; padding: 8px;
      background: var(--display-bg); border-radius: 12px; border: 1px solid var(--border);
    }
    .lng-composition.show { display: flex; }
    .lng-composition .field-row label { font-size: 13px; color: var(--text); }
    .lng-balance {
      font-size: 13px; font-weight: 500; text-align: center;
      padding: 4px; border-radius: 8px; display: none;
    }
    .lng-balance.ok { background: #d4edda; color: #155724; display: block; }
    .lng-balance.warn { background: #fff3cd; color: #856404; display: block; }
    .lng-balance.error { background: #f8d7da; color: #721c24; display: block; }
    body.dark .lng-balance.ok { background: #1e3a2a; color: #8fd19e; }
    body.dark .lng-balance.warn { background: #3d3520; color: #f0c040; }
    body.dark .lng-balance.error { background: #3d1f22; color: #f08c90; }

    #helpModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center;
    }
    #helpModal > div {
      background: var(--surface); border-radius: 16px; padding: 20px; max-width: 500px;
      width: 90%; max-height: 80vh; overflow-y: auto; color: var(--text);
    }
</style>
</head>
<body>
<div class="container">
<div class="header">
<button class="menu-btn" id="menuToggle">⋮</button>
<div class="menu" id="settingsMenu">
<div class="menu-item">
<span id="langLabel">Язык / Language</span>
<select id="langSelect">
<option value="ru">Русский</option>
<option value="en">English</option>
<option value="zh">中文</option>
</select>
</div>
<div class="menu-item">
<span id="themeLabel">Светлая тема</span>
<div class="theme-toggle" id="themeToggle"></div>
</div>
<div class="menu-item">
<button id="shareBtn" style="width:100%;">📤 Поделиться</button>
</div>
<div class="menu-item">
<button id="helpBtn" style="width:100%;"></button>
</div>
</div>
</div>

<div id="helpModal">
<div>
<h2 id="helpTitle">Справка</h2>
<div id="helpContent"></div>
<button id="helpClose" style="margin-top:12px; padding:10px; border-radius:8px; width:100%;">Закрыть</button>
</div>
</div>

<div class="tab-content active">
<div class="display-container">
<div class="formula-display" id="formulaDisplay">Готов к расчёту</div>
<div class="main-display-row">
<label id="lblFlowRate">Скорость потока:</label>
<input type="text" class="main-display" id="mainDisplay" value="0" readonly>
</div>
</div>
<div class="field-row"><label id="lblOuterDiam">Наружный диаметр (мм):</label><input type="number" id="outerDiam" value="57" min="0.1" step="any"></div>
<div class="field-row"><label id="lblWall">Толщина стенки (мм):</label><input type="number" id="wall" value="3.5" min="0" step="any"></div>
<div class="field-row"><label id="lblLength">Длина (м):</label><input type="number" id="length" value="100" min="0.001" step="any"></div>
<div class="field-row"><label id="lblMassFlow">Массовый расход<br>(кг/ч):</label><input type="number" id="massFlow" value="5000" min="0.001" step="any"></div>
<div class="field-row"><label id="lblMode">Режим:</label><select id="modeSelect"><option value="simple" id="modeSimpleText">Упрощённый</option><option value="engineer" id="modeEngineerText">Инженерный</option></select></div>
<div class="field-row"><label id="lblDensity">Плотность (кг/м³):</label><input type="number" id="density" value="1000" min="0.001" step="any"></div>
<div class="engineer-block" id="engineerBlock">
<div class="field-row"><label id="lblMedium">Тип среды:</label><select id="mediumSelect"><option value="liquid" id="mediumLiquidText">Жидкость</option><option value="gas" id="mediumGasText">Газ</option></select></div>
<div class="field-row"><label id="lblPreset">Типичные среды:</label><select id="presetSelect">
<option value="choose" id="presetChooseText">Выберите среду...</option>
<option value="water" id="presetWaterText">Вода</option>
<option value="oil" id="presetOilText">Масло</option>
<option value="air" id="presetAirText">Воздух</option>
<option value="nitrogen" id="presetNitrogenText">Азот</option>
<option value="oxygen" id="presetOxygenText">Кислород</option>
<option value="methane" id="presetMethaneText">Метан</option>
<option value="co2" id="presetCO2Text">CO₂</option>
<option value="lng" id="presetLngText">СПГ / ПГ (смесь)</option>
<option value="parahydrogen" id="presetParahydrogenText">Водород (пара)</option>
<option value="normalhydrogen" id="presetNormalhydrogenText">Водород (норм.)</option>
<option value="helium4" id="presetHelium4Text">Гелий-4</option>
<option value="neon" id="presetNeonText">Неон</option>
<option value="argon" id="presetArgonText">Аргон</option>
<option value="krypton" id="presetKryptonText">Криптон</option>
<option value="xenon" id="presetXenonText">Ксенон</option>
<option value="ammonia" id="presetAmmoniaText">Аммиак</option>
<option value="ethane" id="presetEthaneText">Этан</option>
<option value="ethylene" id="presetEthyleneText">Этилен</option>
<option value="propane" id="presetPropaneText">Пропан</option>
<option value="freon22" id="presetFreon22Text">Фреон-22</option>
</select></div>
<div id="lngComposition" class="lng-composition"></div>
<div class="field-row"><label id="lblViscosity">Вязкость (сСт):</label><input type="number" id="viscosity" value="1.0" min="0.001" step="any"></div>
<div class="field-row"><label id="lblRoughness">Шероховатость (мм):</label><input type="number" id="roughness" value="0.1" min="0" step="any"></div>
<div class="field-row" id="gasPropsRow"><label id="lblPressure">Абс. давление (бар):</label><input type="number" id="pressure" value="1.0" min="0.001" step="any"></div>
<div class="field-row" id="tempRow"><label id="lblTemperature">Температура (°C):</label><input type="number" id="temperature" value="20.0" min="-273.14" step="any"></div>
<div class="field-row" id="molarRow"><label id="lblMolarMass">Молярная масса (г/моль):</label><input type="number" id="molarMass" value="28.97" min="2" max="300" step="any"></div>
</div>
<div class="field-row"><label id="lblBends">Поворотов 90° (ζ=0.3):</label><input type="number" id="bends" value="0" min="0" step="1"></div>
<div class="field-row"><label id="lblValves">Клапанов (ζ=3.0):</label><input type="number" id="valves" value="0" min="0" step="1"></div>
<div id="extraResistances" class="extra-resistances">
<div class="field-row"><label id="lblContractions">Сужений (ζ=0.5):</label><input type="number" id="contractions" value="0" min="0" step="1"></div>
<div class="field-row"><label id="lblExpansions">Расширений (ζ=1.0):</label><input type="number" id="expansions" value="0" min="0" step="1"></div>
<div class="field-row"><label id="lblOrifices">Дросселей/диафрагм (ζ=2.0):</label><input type="number" id="orifices" value="0" min="0" step="1"></div>
</div>
<div class="field-row"><label id="lblPressureUnit">Единицы давления:</label><select id="pressureUnit"><option value="Pa">Pa</option><option value="kPa">kPa</option><option value="bar">bar</option><option value="kgf/cm²">kgf/cm²</option><option value="psi">psi</option></select></div>
<div id="infoBlock" class="info-block">
<div class="info-panel" id="infoPanel"></div>
<div id="reliabilityIndicator" class="reliability-indicator reliability-green" style="display:none;">
<div class="reliability-dot"></div>
<div>
<div id="reliabilityText">Расчёт в пределах применимости моделей</div>
<div id="reliabilityTooltip" class="reliability-tooltip" style="display:none;"></div>
</div>
</div>
<div id="warningListContainer"></div>
</div>
<div class="btn-row">
<button class="calc-btn" id="calculateBtn">Рассчитать</button>
<button class="save-btn" id="saveBtn" disabled>Сохранить в файл</button>
</div>
<div class="result-area" id="resultArea">
<span id="velocityResult">Скорость: ---</span>
<span id="pressureDropResult">Потеря давления: ---</span>
<span id="reynoldsResult">Число Рейнольдса: ---</span>
<span id="lambdaResult">Коэффициент трения λ: ---</span>
<span id="compressNote" class="note"></span>
</div>
</div>
</div>

function interpolateSatTable(table, T_K, col) {
  if (T_K < table[0][0] || T_K > table[table.length-1][0]) return null;
  for (let i = 0; i < table.length-1; i++) {
    if (T_K >= table[i][0] && T_K <= table[i+1][0]) {
      const t = (T_K - table[i][0]) / (table[i+1][0] - table[i][0]);
      return table[i][col] + t * (table[i+1][col] - table[i][col]);
    }
  }
  return null;
}

function getSaturationPressure(T_K, gas) {
  if (gas === 'helium4') return interpolateSatTable(HE4_SAT_TABLE, T_K, 1);
  if (gas === 'parahydrogen') return interpolateSatTable(PH2_SAT_TABLE, T_K, 1);
  if (gas === 'normalhydrogen') return interpolateSatTable(NH2_SAT_TABLE, T_K, 1);
  const coeffs = antoineCoeffs[gas];
  if (!coeffs) return null;
  if (T_K > coeffs.Tmin && T_K < coeffs.Tmax) {
    const P_sat = Math.pow(10, coeffs.A - coeffs.B / (T_K + coeffs.C));
    if (P_sat > 1e5 || P_sat < 1e-12) return null;
    return P_sat;
  }
  return null;
}

function determinePhase(P_bar, P_sat, T_K, Tc) {
  if (T_K >= Tc) return 'supercritical';
  if (P_sat === null) return 'liquid';
  const tol = 0.001;
  if (P_bar < P_sat * (1 - tol)) return 'gas';
  if (P_bar > P_sat * (1 + tol)) return 'liquid';
  return 'two-phase';
}

function alphaTwu(Tr, w) {
  const a0 = Math.pow(Tr, -0.171813) * Math.exp(0.125283 * (1 - Math.pow(Tr, 1.77634)));
  const a1 = Math.pow(Tr, -0.607352) * Math.exp(0.511614 * (1 - Math.pow(Tr, 2.20517)));
  return a0 + w * (a1 - a0);
}

/**
 * Уравнение Пенга-Робинсона с альфа-функцией Тву.
 * Для жидкости используется функция Twu, для газа – стандартная Soave-форма.
 * Выбор корня кубического уравнения – наименьший Z для жидкости, наибольший для сверхкритики и газа.
 */
function calcZ_PengRobinson(T, P_bar, Tc, Pc, w, phase) {
  const Tr = T / Tc;
  if (Tr <= 0 || Pc <= 0) return 1.0;
  let alpha;
  if (phase === 'liquid' && Tr < 1.0) alpha = alphaTwu(Tr, w);
  else {
    const kappa = 0.37464 + 1.54226 * w - 0.26992 * w * w;
    alpha = Math.pow(1 + kappa * (1 - Math.sqrt(Tr)), 2);
  }
  const a = 0.45724 * R_GAS * R_GAS * Tc * Tc / (Pc * 1e5) * alpha;
  const b = 0.07780 * R_GAS * Tc / (Pc * 1e5);
  const A = a * (P_bar * 1e5) / (R_GAS * R_GAS * T * T);
  const B = b * (P_bar * 1e5) / (R_GAS * T);
  const a2 = -(1 - B), a1 = A - 2*B - 3*B*B, a0 = -(A*B - B*B - B*B*B);
  const Q = (3*a1 - a2*a2) / 9, R_ = (9*a2*a1 - 27*a0 - 2*a2*a2*a2) / 54, D = Q*Q*Q + R_*R_;
  let Z;
  if (D >= 0) {
    const sqrtD = Math.sqrt(D), S = Math.cbrt(R_ + sqrtD), T_ = Math.cbrt(R_ - sqrtD);
    Z = S + T_ - a2/3;
  } else {
    const theta = Math.acos(R_ / Math.sqrt(-Q*Q*Q)), sqrtQ = Math.sqrt(-Q);
    const z1 = 2 * sqrtQ * Math.cos(theta/3) - a2/3, z2 = 2 * sqrtQ * Math.cos((theta + 2*Math.PI)/3) - a2/3, z3 = 2 * sqrtQ * Math.cos((theta + 4*Math.PI)/3) - a2/3;
    const roots = [z1, z2, z3].sort((a,b) => a-b);
    if (phase === 'liquid') Z = roots[0];
    else if (phase === 'supercritical' || phase === 'two-phase') Z = roots[2];
    else Z = roots[2];
  }
  return Math.max(Z, 0.05);
}

/**
 * Плотность чистых веществ.
 * Для квантовых газов (He, H2) используются табличные значения насыщенной жидкости/пара,
 * для остальных – уравнение Пенга-Робинсона и метод Ракетта для жидкости.
 */
function calcRealGasDensity(T_C, P_bar, gas) {
  if (gas === 'lng') return calcLngDensity(T_C, P_bar);
  const M_input = parseFloat(document.getElementById('molarMass').value);
  if (isNaN(M_input) || M_input < 2.0 || M_input > 300.0) { alert(t('errorMolarMassRange')); return 1.2; }
  const M = M_input;
  const T_K = T_C + 273.15;
  const crit = gasCritical[gas];
  if (!crit) return (P_bar * 1e5 * (M/1000)) / (R_GAS * T_K);
  const P_sat = getSaturationPressure(T_K, gas);
  const phase = determinePhase(P_bar, P_sat, T_K, crit.Tc);
  window._lastPhaseInfo = { phase, P_sat, gas, T_K, P_bar };
  const isQuantum = (gas === 'helium4' || gas === 'parahydrogen' || gas === 'normalhydrogen');
  const table = isQuantum ? (gas === 'helium4' ? HE4_SAT_TABLE : (gas === 'parahydrogen' ? PH2_SAT_TABLE : NH2_SAT_TABLE)) : null;
  if (isQuantum && table) {
    if (phase === 'liquid') { const rho = interpolateSatTable(table, T_K, 2); if (rho !== null) return rho; }
    if (phase === 'gas' && T_K < crit.Tc) { const rho_vap = interpolateSatTable(table, T_K, 3); if (rho_vap !== null) return rho_vap; }
  }
  if (phase === 'liquid') {
    const rackett = rackettParams[gas];
    if (rackett && T_K < crit.Tc) {
      const Tr = T_K / crit.Tc, Vsat = rackett.Vc * Math.pow(rackett.Zra, Math.pow(1 - Tr, 0.2857));
      return Math.max((M / 1000) / Vsat, 0.5);
    }
  }
  const Z = calcZ_PengRobinson(T_K, P_bar, crit.Tc, crit.Pc, crit.w, phase === 'gas' ? 'gas' : (phase === 'liquid' ? 'liquid' : 'supercritical'));
  const density = (P_bar * 1e5 * (M/1000)) / (Z * R_GAS * T_K);
  return Math.max(density, 0.001);
}

/**
 * Вязкость чистых веществ.
 * Для жидкости – упрощённая корреляция через приведённую температуру и давление,
 * для газа – метод Джосси-Стила-Тодоса (JST) с полиномиальной поправкой на плотность.
 */
function calcRealGasViscosity(T_C, P_bar, gas) {
  if (gas === 'lng') return calcLngViscosity(T_C, P_bar);
  const crit = gasCritical[gas];
  if (!crit) return null;
  const M = parseFloat(document.getElementById('molarMass').value) || 28.97;
  const T_K = T_C + 273.15;
  const Tc = crit.Tc, Pc = crit.Pc;
  const P_sat = getSaturationPressure(T_K, gas);
  const phase = determinePhase(P_bar, P_sat, T_K, Tc);
  if (phase === 'liquid') {
    const Tr = T_K / Tc, mu_boil = 0.1 * Math.pow(M, 0.5) * Math.pow(Tc, -0.5) * 1e-3;
    return Math.max(mu_boil * Math.exp(2.5 * (1 - Tr)) * (1 + 0.5 * Math.max(0, P_bar/Pc - 1)), 1e-6);
  }
  const sigma = 2.44 * Math.pow(Tc / Pc, 1/3);
  const Tstar = T_K / (Tc * 0.77);
  const Omega = 1.16145 * Math.pow(Tstar, -0.14874) + 0.52487 * Math.exp(-0.77320 * Tstar) + 2.16178 * Math.exp(-2.43787 * Tstar);
  const mu0 = 2.6693e-6 * Math.sqrt(M * T_K) / (sigma * sigma * Omega);
  const xi_muP = Math.pow(Tc, 1/6) / (Math.pow(M, 0.5) * Math.pow(Pc, 2/3));
  const psi = (mu0 * 1e7) * xi_muP;
  const rho = calcRealGasDensity(T_C, P_bar, gas);
  const rho_molar = rho / (M / 1000);
  const Vc = 0.27 * R_GAS * Tc / (Pc * 1e5);
  const rho_r = rho_molar * Vc;
  if (rho_r <= 0.001) return mu0;
  const poly = [1.023, 0.23364, 0.58533, -0.40758, 0.093324];
  let sum = 0; for (let i=0; i<poly.length; i++) sum += poly[i] * Math.pow(rho_r, i);
  return Math.max(mu0 * (1 + (Math.pow(sum, 4) - 1) / psi), 0.5 * mu0);
}

function getLngComposition() {
  const getV = id => { const el = document.getElementById(id); return el ? (parseFloat(el.value) || 0) : 0; };
  return { ch4: getV('lngCH4'), c2h6: getV('lngC2H6'), c3h8: getV('lngC3H8'), ic4h10: getV('lngIC4H10'), nc4h10: getV('lngNC4H10'), ic5h12: getV('lngIC5H12'), n2: getV('lngN2') };
}
function checkLngBalance() {
  const c = getLngComposition();
  const total = c.ch4 + c.c2h6 + c.c3h8 + c.ic4h10 + c.nc4h10 + c.ic5h12 + c.n2;
  const el = document.getElementById('lngBalance');
  if (!el) return false;
  el.classList.remove('ok','warn','error');
  if (Math.abs(total-100)<0.01) { el.textContent=t('lngBalanceOk'); el.classList.add('ok'); return true; }
  else if (Math.abs(total-100)<0.5) { el.textContent=t('lngBalanceWarn').replace('{total}',total.toFixed(1)); el.classList.add('warn'); return true; }
  else { el.textContent=t('lngBalanceError').replace('{total}',total.toFixed(1)); el.classList.add('error'); return false; }
}
function calcLngPseudoCritical() {
  const c = getLngComposition(); const total = c.ch4+c.c2h6+c.c3h8+c.ic4h10+c.nc4h10+c.ic5h12+c.n2;
  if (total<=0) return { Tc:200,Pc:45,w:0.02,M:20,Vc:0.0001,Zra:0.28,Tmin:100,Tmax:300,Pmin:0.5,Pmax:50 };
  let Tc=0,Pc=0,w=0,M=0,Vc=0,Zra=0,Tmin=Infinity,Tmax=-Infinity,Pmin=Infinity,Pmax=-Infinity;
  const keys=['ch4','c2h6','c3h8','ic4h10','nc4h10','ic5h12','n2'];
  for(const k of keys) {
    const frac=c[k]/total; if(frac>0&&lngPureComponents[k]){ const p=lngPureComponents[k]; Tc+=frac*p.Tc; Pc+=frac*p.Pc; w+=frac*p.w; M+=frac*p.M; Vc+=frac*p.Vc; Zra+=frac*p.Zra; if(p.Tmin<Tmin)Tmin=p.Tmin; if(p.Tmax>Tmax)Tmax=p.Tmax; if(p.Pmin<Pmin)Pmin=p.Pmin; if(p.Pmax>Pmax)Pmax=p.Pmax; }
  }
  if(Tmin===Infinity)Tmin=100; if(Tmax===-Infinity)Tmax=300; if(Pmin===Infinity)Pmin=0.5; if(Pmax===-Infinity)Pmax=50;
  return {Tc,Pc,w,M,Vc,Zra,Tmin,Tmax,Pmin,Pmax};

function calcLngSaturationPressure(T_C) { const p=calcLngPseudoCritical(); const T_K=T_C+273.15; if(T_K>=p.Tc)return null; if(T_K<p.Tc*0.35)return null; const A=3.9+0.5*p.w,B=400+300*p.w,C=-20-30*p.w; return Math.pow(10,A-B/(T_K+C)); }

function calcLngDensity(T_C,P_bar){ const p=calcLngPseudoCritical(); const T_K=T_C+273.15; const Tr=T_K/p.Tc; if(Tr>=1.0){const Z=calcZ_PengRobinson(T_K,P_bar,p.Tc,p.Pc,p.w,'supercritical');return Math.max((P_bar*1e5*(p.M/1000))/(Z*R_GAS*T_K),0.5);} const phase=determineLngPhase(T_C,P_bar); if(phase==='gas'||phase==='supercritical'){const Z=calcZ_PengRobinson(T_K,P_bar,p.Tc,p.Pc,p.w,'gas');return Math.max((P_bar*1e5*(p.M/1000))/(Z*R_GAS*T_K),0.001);} const Vsat=p.Vc*Math.pow(p.Zra,Math.pow(1-Tr,2/7)); let density=(p.M/1000)/Vsat; const Pr=P_bar/p.Pc; if(Pr>0.1)density*=(1+0.01*Pr); return Math.max(density,0.5); }
function calcLngViscosity(T_C,P_bar){ const p=calcLngPseudoCritical(); const T_K=T_C+273.15; const Tr=T_K/p.Tc; const phase=determineLngPhase(T_C,P_bar); if(phase==='gas'||phase==='supercritical'){const sigma=2.44*Math.pow(p.Tc/p.Pc,1/3); const Tstar=T_K/(p.Tc*0.77); const Omega=1.16145*Math.pow(Tstar,-0.14874)+0.52487*Math.exp(-0.77320*Tstar)+2.16178*Math.exp(-2.43787*Tstar); const mu0=2.6693e-6*Math.sqrt(p.M*T_K)/(sigma*sigma*Omega); return Math.max(mu0,1e-6);} const mu_ref=0.12,temp_factor=Math.exp(2.0*(1-Tr)); let viscosity=mu_ref*temp_factor; const Pr=P_bar/p.Pc; if(Pr>0.1)viscosity*=(1+0.3*Math.max(0,Pr-0.1)); return Math.max(viscosity*1e-3,5e-5); }

function getGammaDetailed(p){ const m={air:1.4,nitrogen:1.4,oxygen:1.4,methane:1.31,co2:1.29,parahydrogen:1.41,normalhydrogen:1.41,helium4:1.667,neon:1.667,argon:1.667,krypton:1.667,xenon:1.667,ammonia:1.31,ethane:1.19,ethylene:1.24,propane:1.13,freon22:1.19,lng:1.25,water:1.33,oil:1.10}; return m[p]||1.4; }
function calcSoundSpeed(){ if(modeSelect.value==='simple'||mediumSelect.value!=='gas')return null; const T=parseFloat(document.getElementById('temperature').value); const M=(presetSelect.value==='lng')?calcLngPseudoCritical().M:parseFloat(document.getElementById('molarMass').value); if(isNaN(T)||isNaN(M)||M<=0)return null; return Math.sqrt(getGammaDetailed(presetSelect.value)*R_GAS*(T+273.15)/(M/1000)); }

function getAllMessages(){
  const preset=presetSelect.value,mediumType=mediumSelect.value,mode=modeSelect.value;
  if(mode==='simple'||preset==='choose')return{level:-1,messages:[]};
  const T=parseFloat(document.getElementById('temperature').value),P=parseFloat(document.getElementById('pressure').value);
  if(isNaN(T)||isNaN(P))return{level:-1,messages:[]};
  const T_K=T+273.15; let level=0; const messages=[];
  if(preset==='lng'){
    level=Math.max(level,1); messages.push({text:t('reliabilityLng'),type:'caution'});
    const phase=determineLngPhase(T,P),pseudo=calcLngPseudoCritical();
    if(phase==='supercritical'){level=Math.max(level,2);messages.push({text:t('reliabilityLngSupercritical').replace('{tr}',(T_K/pseudo.Tc).toFixed(2)),type:'critical'});}
    else if(phase==='two-phase'){level=Math.max(level,1);messages.push({text:t('reliabilityLngTwoPhase'),type:'caution'});}
    if(phase==='liquid'||phase==='two-phase'){messages.push({text:t('reliabilityLiquidGas'),type:'caution'});}
    if(!checkLngBalance())messages.push({text:t('lngBalanceError').replace('{total}','?'),type:'critical'});
    const limits=getCurrentLngLimits();
    if(limits){const tmin=limits.Tmin-273.15,tmax=limits.Tmax-273.15; if(T<tmin||T>tmax)messages.push({text:t('reliabilityGasLimitsTemp').replace('{tmin}',tmin.toFixed(0)).replace('{tmax}',tmax.toFixed(0)),type:'caution'}); if(P<limits.Pmin||P>limits.Pmax)messages.push({text:t('reliabilityGasLimitsPressure').replace('{pmin}',limits.Pmin.toFixed(4)).replace('{pmax}',limits.Pmax.toFixed(1)),type:'caution'});}
    return{level,messages};
  }
  const crit=gasCritical[preset];
  if(mediumType==='gas'&&crit){
    const Tr=T_K/crit.Tc,Pr=P/crit.Pc,P_sat=getSaturationPressure(T_K,preset),phase=determinePhase(P,P_sat,T_K,crit.Tc);
    const isSub=T_K<crit.Tc,isLiq=(phase==='liquid'||phase==='two-phase');
    if(Tr>0.92&&Pr>0.85){level=2;messages.push({text:t('reliabilityCriticalRegion').replace('{tr}',Tr.toFixed(2)).replace('{pr}',Pr.toFixed(2)),type:'critical'});}
    else if(Tr>0.85&&Pr>0.7){level=1;messages.push({text:t('reliabilityNearCritical').replace('{tr}',Tr.toFixed(2)).replace('{pr}',Pr.toFixed(2)),type:'caution'});}
    if(['parahydrogen','normalhydrogen','helium4'].includes(preset)&&T_K<50){level=1;messages.push({text:t('reliabilityQuantum').replace('{t}',T.toFixed(1)),type:'caution'});}
    if(preset==='ammonia'&&(T_K>370||P>80)){level=1;messages.push({text:t('reliabilityPolar'),type:'caution'});}
    const limits=gasLimits[preset];
    if(limits){const tmin=limits.Tmin-273.15,tmax=limits.Tmax-273.15; if(T<tmin||T>tmax){level=1;messages.push({text:t('reliabilityGasLimitsTemp').replace('{tmin}',tmin.toFixed(0)).replace('{tmax}',tmax.toFixed(0)),type:'caution'});} if(P<limits.Pmin||P>limits.Pmax){level=1;messages.push({text:t('reliabilityGasLimitsPressure').replace('{pmin}',limits.Pmin.toFixed(4)).replace('{pmax}',limits.Pmax.toFixed(1)),type:'caution'});}}
    const antoine=antoineCoeffs[preset];
    if(antoine&&isSub&&isLiq&&(T_K<antoine.Tmin||T_K>antoine.Tmax)){level=1;messages.push({text:t('reliabilityAntoine').replace('{tmin}',(antoine.Tmin-273.15).toFixed(0)).replace('{tmax}',(antoine.Tmax-273.15).toFixed(0)),type:'info'});}
    if(P_sat!==null&&isSub){ if(isLiq&&P>=P_sat*(1-0.001))messages.push({text:t('warningSaturationAbove'),type:'caution'}); else if(!isLiq&&P>=P_sat*0.9)messages.push({text:t('warningNearSaturation'),type:'info'}); }
    if(isSub&&isLiq&&preset!=='water'&&preset!=='oil'){level=1;messages.push({text:t('reliabilityLiquidGas'),type:'caution'});}
    if(!isLiq){const Z=calcZ_PengRobinson(T_K,P,crit.Tc,crit.Pc,crit.w,'gas'); if(Math.abs(Z-1)>0.2){level=1;messages.push({text:t('reliabilityZ').replace('{z}',Z.toFixed(2)),type:'info'});}}
    if(['helium4','parahydrogen','normalhydrogen'].includes(preset)&&phase==='liquid'){level=Math.max(level,1);messages.push({text:t('reliabilityCryoVisc'),type:'caution'});}
  }
  if(mediumType==='liquid'&&preset!=='choose'&&preset!=='lng'){
    const liq=liquidLimits[preset];
    if(liq){const d=parseFloat(document.getElementById('density').value),v=parseFloat(document.getElementById('viscosity').value); if(!isNaN(d)&&(d<liq.densityMin||d>liq.densityMax)){level=1;messages.push({text:t('warningLiquidDensity'),type:'caution'});} if(!isNaN(v)&&(v<liq.viscosityMin||v>liq.viscosityMax)){level=1;messages.push({text:t('warningLiquidViscosity'),type:'caution'});}}
    if(preset!=='water'&&preset!=='oil'){level=1;messages.push({text:t('reliabilityLiquidGas'),type:'caution'});}
  }
  return{level,messages};
}

}

function getCurrentLngLimits(){
  const T=parseFloat(document.getElementById('temperature').value),P=parseFloat(document.getElementById('pressure').value);
  if(isNaN(T)||isNaN(P))return{Tmin:100,Tmax:600,Pmin:0.01,Pmax:1000};
  const phase=determineLngPhase(T,P),pseudo=calcLngPseudoCritical();
  if(phase==='supercritical')return{Tmin:100,Tmax:600,Pmin:0.01,Pmax:1000};
  if(phase==='gas')return{Tmin:pseudo.Tmin,Tmax:Math.max(pseudo.Tmax,600),Pmin:0.01,Pmax:Math.max(pseudo.Pmax,1000)};
  return{Tmin:pseudo.Tmin,Tmax:pseudo.Tc-1.0,Pmin:0.5,Pmax:Math.min(pseudo.Pc*0.8,50)};
}

    lngComposition.classList.add('show'); buildLngComposition(); syncLngProperties();
  }else{
    lngComposition.classList.remove('show'); lngComposition.innerHTML='';
    if(p=='water'||p=='oil')mediumSelect.value='liquid';else mediumSelect.value='gas';
    updatePropertiesForState(p);applyGasLimits();
  }
  updateEngineerVisibility();
  if(mediumSelect.value==='gas'&&p!=='lng')syncFromTempPress();
  updateAllWarnings();updateFieldBorders();resetResults();
}
function applyGasLimits(){
  if(presetSelect.value==='lng'){applyLngLimitsToFields();return;}
  const ti=document.getElementById('temperature'),pi=document.getElementById('pressure'),l=gasLimits[presetSelect.value];
  if(l){ti.min=(l.Tmin-273.15).toFixed(2);ti.max=(l.Tmax-273.15).toFixed(2);pi.min=l.Pmin.toFixed(4);pi.max=l.Pmax.toFixed(1);}
  else{ti.min=-273.15;ti.max=2000;pi.min=0.0001;pi.max=1000;}
}
function resetResults(){
  lastResult={velocity:0,deltaP:0,re:0,lambda:0,mode:'',mediumType:'',preset:'',pressureUnit:'Pa',compressDiff:null,compressMach:false,compressCorrection:null};
  updateResultLabels();const n=document.getElementById('compressNote');n.textContent='';n.classList.remove('show');n.style.display='none';
  saveBtn.disabled=true;formulaDisplay.textContent=t('ready');mainDisplay.value='0';
}
function updateResultLabels(){
  velocityResult.textContent=t('velocity')+': '+(lastResult.velocity>0?lastResult.velocity.toFixed(3)+' '+locales[currentLang].units.m_s:'---');
  pressureDropResult.textContent=t('pressureDrop')+': '+(lastResult.deltaP>0?formatPressure(lastResult.deltaP,lastResult.pressureUnit):'---');
  reynoldsResult.textContent=t('reynolds')+': '+(lastResult.re>0?lastResult.re.toFixed(0):'---');
  lambdaResult.textContent=t('lambda')+': '+(lastResult.lambda>0?lastResult.lambda.toFixed(4):'---');
}
function updateDisplayWithResult(){
  const u=lastResult.pressureUnit,pf=formatPressure(lastResult.deltaP,u);
  formulaDisplay.textContent=t('resultSummary').replace('{velocity}',lastResult.velocity.toFixed(3)).replace('{pressure}',pf.split(' ')[0]).replace('{unit}',(locales[currentLang].units[u]||u));
  mainDisplay.value=lastResult.velocity.toFixed(3);
}
calculateBtn.addEventListener('click',()=>{
  try{
    const bends=parseInt(document.getElementById('bends').value)||0,valves=parseInt(document.getElementById('valves').value)||0,contractions=parseInt(document.getElementById('contractions').value)||0,expansions=parseInt(document.getElementById('expansions').value)||0,orifices=parseInt(document.getElementById('orifices').value)||0;
    const outerD=parseFloat(document.getElementById('outerDiam').value),wall=parseFloat(document.getElementById('wall').value),density=parseFloat(document.getElementById('density').value),length=parseFloat(document.getElementById('length').value),massFlow=parseFloat(document.getElementById('massFlow').value);
    const Tval=parseFloat(document.getElementById('temperature').value),Pval=parseFloat(document.getElementById('pressure').value);
    if(isNaN(Tval)||Tval<=-273.15){alert(t('errorTempAbs'));return}
    if(isNaN(Pval)||Pval<=0){alert(t('errorPresAbs'));return}
    if(modeSelect.value==='engineer'&&presetSelect.value!=='choose'){
      const preset=presetSelect.value;let limits;
      if(preset==='lng'){limits=getCurrentLngLimits();}else{limits=gasLimits[preset];}
      if(limits){
        const tmin=limits.Tmin-273.15,tmax=limits.Tmax-273.15;
        if(Tval<tmin||Tval>tmax){alert(t('errorTempLimit').replace('{min}',tmin.toFixed(1)).replace('{max}',tmax.toFixed(1)));return}
        if(Pval<limits.Pmin||Pval>limits.Pmax){alert(t('errorPresLimit').replace('{min}',limits.Pmin.toFixed(4)).replace('{max}',limits.Pmax.toFixed(1)));return}
      }
    }
    if(outerD<=0||wall<0||outerD-2*wall<=0){alert(t('errorDiam'));return}
    if(density<=0||length<=0||massFlow<=0){alert(t('errorPos'));return}
    const innerD=outerD-2*wall,area=Math.PI*Math.pow(innerD/1000,2)/4,velocity=massFlow/3600/area/density;
    let deltaP,lambda=0,re=0,compressDiff=null,machExceeded=false,compressCorrection=null;
    if(modeSelect.value=='simple'){deltaP=density*Math.pow(velocity,2)/2*(41*length/innerD+5*valves+0.17*bends);lastResult.mode='simple'}
    else{
      const viscosity=parseFloat(document.getElementById('viscosity').value),roughness=parseFloat(document.getElementById('roughness').value),kinVisc=viscosity*1e-6,medium=mediumSelect.value;
      lastResult.mediumType=medium;lastResult.preset=presetSelect.value;
      if(medium=='gas'&&presetSelect.value!=='lng'){const P=parseFloat(document.getElementById('pressure').value)*1e5,T=parseFloat(document.getElementById('temperature').value)+273.15,M=parseFloat(document.getElementById('molarMass').value)/1000;compressDiff=Math.abs(density-P*M/(R_GAS*T))/(P*M/(R_GAS*T))*100}
      re=velocity*(innerD/1000)/kinVisc;lambda=(re<2300)?64/re:0.25/Math.pow(Math.log10(roughness/innerD/3.7+5.74/Math.pow(re,0.9)),2);
      const totalZeta=lambda*length*1000/innerD+bends*0.3+valves*3.0+contractions*0.5+expansions*1.0+orifices*2.0,dP0=totalZeta*density*velocity*velocity/2;
      let dPf=dP0;
      if(medium=='gas'){compressCorrection=calcCompressibilityCorrection(velocity,dP0);dPf=compressCorrection.dP_corrected;machExceeded=compressCorrection.mach>0.3;updateCompressNoteFromCorr(compressCorrection)}
      else{const n=document.getElementById('compressNote');n.textContent='';n.classList.remove('show');n.style.display='none'}
      deltaP=dPf;lastResult.re=re;lastResult.lambda=lambda;
    }
    lastResult.velocity=velocity;lastResult.deltaP=deltaP;lastResult.pressureUnit=document.getElementById('pressureUnit').value;
    lastResult.compressDiff=(compressDiff!==null&&compressDiff>10)?compressDiff:null;lastResult.compressMach=machExceeded;
    lastResult.compressCorrection=compressCorrection||null;
    saveBtn.disabled=false;updateResultLabels();updateDisplayWithResult();updateAllWarnings();updateFieldBorders();
  }catch(e){alert(t('errorNum'))}
});
function formatPressure(pa,unit){
  const loc=locales[currentLang],unitLoc=loc.units[unit]||unit;let v;
  switch(unit){case'Pa':v=pa;break;case'kPa':v=pa/1e3;break;case'bar':v=pa/1e5;break;case'kgf/cm²':v=pa/98066.5;break;case'psi':v=pa/6894.76;break;default:v=pa}
  return v.toFixed(3)+' '+unitLoc;
}
saveBtn.addEventListener('click',()=>{
  const r=buildReport();if(typeof AndroidSave!=='undefined'&&AndroidSave.saveReport)AndroidSave.saveReport(r);else{const b=new Blob([r],{type:'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='hydraulic_report_'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.txt';a.click();URL.revokeObjectURL(u);alert(t('fileSaved'))}
});
function buildReport(){
  const loc=locales[currentLang];let r=`=== ${loc.title} ===\n${new Date().toLocaleString()}\n`;
  if(lastResult.mode=='engineer')r+=`${loc.medium} ${loc[lastResult.mediumType]||lastResult.mediumType}\n${loc.presetLabel} ${loc['preset'+(lastResult.preset.charAt(0).toUpperCase()+lastResult.preset.slice(1))]||lastResult.preset}\n`;
  r+=`\n--- ${loc.calculate} ---\n`;
  r+=`${loc.bends.split(' ')[0]} ${document.getElementById('bends').value}\n${loc.valves.split(' ')[0]} ${document.getElementById('valves').value}\n${loc.contractions.split(' ')[0]} ${document.getElementById('contractions').value}\n${loc.expansions.split(' ')[0]} ${document.getElementById('expansions').value}\n${loc.orifices.split(' ')[0]} ${document.getElementById('orifices').value}\n`;
  r+=`${loc.outerDiam.split(' ')[0]} ${document.getElementById('outerDiam').value} ${loc.units.mm}\n${loc.wall.split(' ')[0]} ${document.getElementById('wall').value} ${loc.units.mm}\n${loc.length.split(' ')[0]} ${document.getElementById('length').value} ${loc.units.m}\n`;
  r+=`${loc.massFlow.split('<br>')[0].replace(/:/g,'')} ${document.getElementById('massFlow').value} ${loc.units.kgh}\n${loc.density.split(' ')[0]} ${document.getElementById('density').value} ${loc.units.kgm3}\n`;
  if(lastResult.mode=='engineer'){
    r+=`${loc.viscosity.split(' ')[0]} ${document.getElementById('viscosity').value} ${loc.units.cSt}\n${loc.roughness.split(' ')[0]} ${document.getElementById('roughness').value} ${loc.units.mm}\n`;
    if(lastResult.mediumType=='gas')r+=`${loc.pressure.split(' ')[0]} ${document.getElementById('pressure').value} ${loc.units.bar}\n${loc.temperature.split(' ')[0]} ${document.getElementById('temperature').value} °C\n${loc.molarMass.split(' ')[0]} ${document.getElementById('molarMass').value} ${loc.units.gmol}\n`;
  }
  r+=`\n--- ${loc.save} ---\n${loc.velocity}: ${lastResult.velocity.toFixed(3)} ${loc.units.m_s}\n${loc.pressureDrop}: ${formatPressure(lastResult.deltaP,lastResult.pressureUnit)}\n`;
  if(lastResult.re>0)r+=`${loc.reynolds}: ${lastResult.re.toFixed(0)}\n`;
  if(lastResult.lambda>0)r+=`${loc.lambda}: ${lastResult.lambda.toFixed(4)}\n`;
  return r;
}
shareBtn.addEventListener('click',()=>{
  const u='https://github.com/Empers100/HydraulicCalculator',txt=(lastResult.velocity>0)?buildReport():t('shareText');
  if(typeof AndroidShare!=='undefined'&&AndroidShare.shareText)AndroidShare.shareText(t('title'),txt,u);
  else if(navigator.share)navigator.share({title:t('title'),text:txt,url:u}).catch(()=>{});
  settingsMenu.classList.remove('show');
});
document.querySelectorAll('input[type="number"]').forEach(input=>{
  if(input.id==='temperature')return;
  input.addEventListener('keydown',e=>{if(e.key==='-'||e.key==='+'||e.key==='e'||e.key==='E')e.preventDefault()});
  input.addEventListener('input',function(){this.value=this.value.replace(/[^\d.,]/g,'').replace(',','.');const d=this.value.indexOf('.');if(d!==-1)this.value=this.value.substring(0,d+1)+this.value.substring(d+1).replace(/\./g,'')});
  input.addEventListener('blur',function(){if(this.id==='bends'||this.id==='valves'){let i=parseInt(this.value);this.value=(!isNaN(i)&&i>=0)?i:0} if(this.id==='molarMass'){let val=parseFloat(this.value);if(isNaN(val))val=28.97;if(val<2)val=2;if(val>300)val=300;this.value=val} if(this.value.endsWith('.'))this.value=this.value.slice(0,-1)});
});
function updateEngineerVisibility(){
  const eng=modeSelect.value==='engineer'; engineerBlock.classList.toggle('show',eng); extraResistances.classList.toggle('show',eng); infoBlock.classList.toggle('show',eng);
  if(eng){infoPanel.classList.add('show');updateInfoPanel()}else{infoPanel.classList.remove('show')}
  updateGasPropsVisibility();
}
function updateGasPropsVisibility(){
  const isGas=mediumSelect.value==='gas',isLng=presetSelect.value==='lng';
  document.getElementById('gasPropsRow').style.display=(isGas||isLng)?'flex':'none';
  document.getElementById('tempRow').style.display=(isGas||isLng)?'flex':'none';
  document.getElementById('molarRow').style.display=(isGas&&!isLng)?'flex':'none';
  document.getElementById('density').readOnly=isLng; document.getElementById('viscosity').readOnly=isLng;
  if(isLng)mediumSelect.disabled=true;else mediumSelect.disabled=false;
  // Молярная масса фиксируется при выбранном газовом пресете
  const isPreset = presetSelect.value !== 'choose';
  document.getElementById('molarMass').readOnly = (isPreset && isGas);
}
modeSelect.addEventListener('change',()=>{updateEngineerVisibility();if(modeSelect.value==='engineer'&&mediumSelect.value==='gas'&&presetSelect.value!=='lng')syncFromTempPress();resetResults()});
mediumSelect.addEventListener('change',()=>{const p=presetSelect.value;if(p==='lng'){return}if((p=='water'||p=='oil')&&mediumSelect.value=='gas')presetSelect.value='choose';else if(p!=='choose')updatePropertiesForState(p);updateGasPropsVisibility();applyGasLimits();updateInfoPanel();updateAllWarnings();updateFieldBorders();resetResults();if(mediumSelect.value==='gas')syncFromTempPress()});
presetSelect.addEventListener('change',()=>{const p=presetSelect.value;if(p!=='choose')applyPreset(p);else{resetResults();updateEngineerVisibility();}});

function buildLngComposition(){
  const container=document.getElementById('lngComposition'); container.innerHTML='';
  const components=[{id:'lngCH4',key:'lngCH4',value:'92'},{id:'lngC2H6',key:'lngC2H6',value:'5'},{id:'lngC3H8',key:'lngC3H8',value:'2'},{id:'lngIC4H10',key:'lngIC4H10',value:'0.3'},{id:'lngNC4H10',key:'lngNC4H10',value:'0.2'},{id:'lngIC5H12',key:'lngIC5H12',value:'0.1'},{id:'lngN2',key:'lngN2',value:'0.4'}];
  components.forEach(c=>{
    const row=document.createElement('div'); row.className='field-row';
    const label=document.createElement('label'); label.textContent=t(c.key);
    const input=document.createElement('input'); input.type='number'; input.id=c.id; input.value=c.value; input.min='0';input.max='100';input.step='0.1';
    row.appendChild(label);row.appendChild(input);container.appendChild(row);
    input.addEventListener('change',()=>{updateAllWarnings();updateFieldBorders();if(presetSelect.value==='lng'){checkLngBalance();syncLngProperties();}});
    input.addEventListener('input',()=>{if(presetSelect.value==='lng')checkLngBalance();});
  });
  const balanceDiv=document.createElement('div'); balanceDiv.id='lngBalance'; balanceDiv.className='lng-balance'; container.appendChild(balanceDiv);
}

/* ============== СПРАВКА ============== */
function updateHelpContent(){
  document.getElementById('helpTitle').textContent = t('helpTitle');
  document.getElementById('helpContent').innerHTML = t('helpContent');
  document.getElementById('helpClose').textContent = t('helpClose');
}
helpBtnEl.addEventListener('click',()=>{
  updateHelpContent();
  document.getElementById('helpModal').style.display='flex';
});
document.getElementById('helpClose').addEventListener('click',()=>{
  document.getElementById('helpModal').style.display='none';
});
document.getElementById('helpModal').addEventListener('click',(e)=>{
  if(e.target===document.getElementById('helpModal')) document.getElementById('helpModal').style.display='none';
});

function applyLanguage(){
  document.title=t('title');document.getElementById('langLabel').textContent=t('langLabel');
  document.getElementById('lblBends').textContent=t('bends');document.getElementById('lblValves').textContent=t('valves');
  document.getElementById('lblOuterDiam').textContent=t('outerDiam');document.getElementById('lblWall').textContent=t('wall');
  document.getElementById('lblLength').textContent=t('length');document.getElementById('lblMassFlow').innerHTML=t('massFlow');
  document.getElementById('lblDensity').textContent=t('density');
  document.getElementById('modeSimpleText').textContent=t('modeSimple');document.getElementById('modeEngineerText').textContent=t('modeEngineer');
  document.getElementById('lblMode').textContent=t('modeLabel');document.getElementById('lblMedium').textContent=t('medium');
  document.getElementById('mediumLiquidText').textContent=t('liquid');document.getElementById('mediumGasText').textContent=t('gas');
  document.getElementById('lblPreset').textContent=t('presetLabel');document.getElementById('presetChooseText').textContent=t('presetChoose');
  ['Water','Oil','Air','Nitrogen','Oxygen','Methane','CO2','Lng','Parahydrogen','Normalhydrogen','Helium4','Neon','Argon','Krypton','Xenon','Ammonia','Ethane','Ethylene','Propane','Freon22'].forEach(k=>{const el=document.getElementById('preset'+k+'Text');if(el)el.textContent=t('preset'+k)});
  document.getElementById('lblViscosity').textContent=t('viscosity');document.getElementById('lblRoughness').textContent=t('roughness');
  document.getElementById('lblPressure').textContent=t('pressure');document.getElementById('lblTemperature').textContent=t('temperature');
  document.getElementById('lblMolarMass').innerHTML=t('molarMass');document.getElementById('lblPressureUnit').textContent=t('pressureUnit');
  document.getElementById('lblContractions').textContent=t('contractions');document.getElementById('lblExpansions').textContent=t('expansions');
  document.getElementById('lblOrifices').textContent=t('orifices');calculateBtn.textContent=t('calculate');saveBtn.textContent=t('save');
  document.getElementById('shareBtn').textContent='📤 '+t('share');
  helpBtnEl.textContent = '❓ ' + t('helpBtn');
  lblFlowRate.textContent=t('flowRate');
  const pu=document.getElementById('pressureUnit');pu.innerHTML='';
  [{value:'Pa',ru:'Па',en:'Pa',zh:'帕'},{value:'kPa',ru:'кПа',en:'kPa',zh:'千帕'},{value:'bar',ru:'бар',en:'bar',zh:'巴'},{value:'kgf/cm²',ru:'кгс/см²',en:'kgf/cm²',zh:'千克力/平方厘米'},{value:'psi',ru:'psi',en:'psi',zh:'psi'}].forEach(o=>{const opt=document.createElement('option');opt.value=o.value;opt.textContent=o[currentLang]||o.en;pu.appendChild(opt)});
  if(lastResult.pressureUnit)pu.value=lastResult.pressureUnit;
  updateResultLabels();updateThemeLabel();updateEngineerVisibility();
  if(lastResult.velocity>0)updateDisplayWithResult();else{formulaDisplay.textContent=t('ready');mainDisplay.value='0'}
  updateAllWarnings();updateFieldBorders();
  const n=document.getElementById('compressNote');
  if(lastResult.velocity>0&&lastResult.mediumType==='gas'&&lastResult.compressCorrection){updateCompressNoteFromCorr(lastResult.compressCorrection);}
  else if(lastResult.compressMach||lastResult.compressDiff){n.classList.add('show');n.style.display='block';}
  else{n.classList.remove('show');n.style.display='none';}
  if(presetSelect.value==='lng'){buildLngComposition();checkLngBalance();}
  updateHelpContent();
}
langSelect.addEventListener('change',()=>{currentLang=langSelect.value;localStorage.setItem('calc_hyd_lang',currentLang);applyLanguage()});
applyLanguage();updateEngineerVisibility();buildLngComposition();
})();
